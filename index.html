<!DOCTYPE html>
<!--

  Date: 10.16.2026

  This is the index file for the TVMaze Show Gallery project. 
  It contains the HTML structure for the web page, including the header, search form, gallery section, and footer. 
  The page is styled using an external CSS file (styles.css) and includes a JavaScript file (script.js) for interactivity using the tvmaze API.
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVMaze Show Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>TV Show Gallery</h1>

        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search TV Shows...">
            <button type="submit">Search</button>
        </form>

        <p id="message"></p>
    </header>

    <main>
        <div id="gallery" class="gallery"></div>
    </main>

    <footer>
        Data provided by
        <a href="https://www.tvmaze.com/" target="_blank">
            TVmaze
        </a>
    </footer>


</body>

</html>
